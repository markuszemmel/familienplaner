<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Familien-Küchenkalender Familie Zemmel</title>
  <style>
    :root {
      --primary-color: #2e5a36;
      --bg-color: #f4f6f4;
      --text-color: #333;
      --border-color: #d1d8d1;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }
    header {
      background-color: var(--primary-color);
      color: white;
      padding: 10px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .nav-bar button {
      background-color: white;
      color: var(--primary-color);
      border: none;
      padding: 8px 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .actions-bar {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 5px;
    }
    .actions-bar button {
      border: none;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-next { background-color: #27ae60; color: white; }
    .btn-today { background-color: #e67e22; color: white; }
    .btn-birthday { background-color: #27ae60; color: white; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 5px;
    }
    th, td {
      border: 1px solid var(--border-color);
      padding: 6px 4px;
      text-align: center;
      font-size: 13px;
      vertical-align: top;
    }
    th {
      background-color: var(--primary-color);
      color: white;
    }
    .day-cell {
      font-weight: bold;
      width: 15%;
      background-color: #fafafa;
      vertical-align: middle;
      font-size: 12px;
    }
    .appointment {
      font-size: 11px;
      margin-bottom: 3px;
      padding: 3px 5px;
      background: #e2f0d9;
      border-radius: 3px;
      text-align: left;
    }
    .weather-info {
      font-size: 11px;
      margin-top: 4px;
      color: #555;
    }
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--primary-color);
      color: white;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      text-decoration: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-bar">
      <button onclick="changeMonth(-1)">&lt; Zurück</button>
      <h2 id="month-year-title" style="margin: 0; font-size: 18px;">Lade...</h2>
      <button onclick="changeMonth(1)">Vor &gt;</button>
    </div>
    <div class="actions-bar">
      <button class="btn-next" onclick="showNextEvents()">📅 Nächste</button>
      <button class="btn-today" onclick="goToToday()">📍 Heute</button>
      <button class="btn-birthday" onclick="showBirthdays()">🎂 Geburtstage</button>
    </div>
  </header>

  <div id="calendar-container">
    <table id="calendar-table">
      <thead>
        <tr>
          <th>Tag</th>
          <th>Mama</th>
          <th>Jonathan</th>
          <th>Clara</th>
          <th>Papa</th>
        </tr>
      </thead>
      <tbody id="calendar-body">
        <!-- Wird dynamisch gefüllt -->
      </tbody>
    </table>
  </div>

  <a href="https://calendar.google.com/calendar/u/0/r/eventedit" target="_blank" class="fab">+</a>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxts-P_InE6VACAYnm1VF4QhubgGdvnfvgOymMv8Hrhzbne5iQ0hs6iKZ2KySf7ltgjpg/exec";
    
    let currentDate = new Date();
    let cachedEvents = [];
    let weatherData = {};

    async function fetchEvents() {
      try {
        let response = await fetch(SCRIPT_URL);
        cachedEvents = await response.json();
        await fetchWeather();
        renderCalendar();
      } catch (error) {
        document.getElementById("month-year-title").innerText = "Ladefehler!";
      }
    }

    // Wetter für Wolfschlugen über kostenlose Open-Meteo API laden
    async function fetchWeather() {
      try {
        let res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=48.65&longitude=9.32&daily=weathercode,temperature_2m_max&timezone=Europe%2FBerlin");
        let data = await res.json();
        if (data && data.daily) {
          for (let i = 0; i < data.daily.time.length; i++) {
            weatherData[data.daily.time[i]] = {
              temp: Math.round(data.daily.temperature_2m_max[i]),
              code: data.daily.weathercode[i]
            };
          }
        }
      } catch (e) {
        console.log("Wetter konnte nicht geladen werden");
      }
    }

    function getWeatherEmoji(code) {
      if (code === 0) return "☀️";
      if (code >= 1 && code <= 3) return "⛅";
      if (code >= 45 && code <= 48) return "🌫️";
      if (code >= 51 && code <= 67) return "🌧️";
      if (code >= 71 && code <= 77) return "❄️";
      return "☁️";
    }

    function renderCalendar() {
      let year = currentDate.getFullYear();
      let month = currentDate.getMonth();

      const months = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
      document.getElementById("month-year-title").innerText = months[month] + " " + year;

      let tbody = document.getElementById("calendar-body");
      tbody.innerHTML = "";

      let daysInMonth = new Date(year, month + 1, 0).getDate();
      let weekdays = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

      for (let day = 1; day <= daysInMonth; day++) {
        let dateObj = new Date(year, month, day);
        let dayOfWeek = weekdays[dateObj.getDay()];

        let row = document.createElement("tr");

        let tdDay = document.createElement("td");
        tdDay.className = "day-cell";
        
        let dateString = year + "-" + String(month + 1).padStart(2, '0') + "-" + String(day).padStart(2, '0');
        let w = weatherData[dateString];
        let weatherHtml = w ? `<div class="weather-info">${getWeatherEmoji(w.code)} ${w.temp}°</div>` : "";

        tdDay.innerHTML = `${dayOfWeek}<br><strong>${day}</strong>${weatherHtml}`;
        
        let today = new Date();
        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          tdDay.style.backgroundColor = "#ffeeba";
        }
        row.appendChild(tdDay);

        let dayEvents = cachedEvents.filter(ev => {
          let evDate = new Date(ev.start);
          return evDate.getDate() === day && evDate.getMonth() === month && evDate.getFullYear() === year;
        });

        let mamaEvents = [];
        let jonathanEvents = [];
        let claraEvents = [];
        let papaEvents = [];

        dayEvents.forEach(e => {
          let t = e.title.toLowerCase();
          if (t.includes("mama")) {
            mamaEvents.push(e);
          } else if (t.includes("jonathan")) {
            jonathanEvents.push(e);
          } else if (t.includes("clara")) {
            claraEvents.push(e);
          } else if (t.includes("papa")) {
            papaEvents.push(e);
          } else {
            papaEvents.push(e);
          }
        });

        let personCols = [mamaEvents, jonathanEvents, claraEvents, papaEvents];

        for (let i = 0; i < 4; i++) {
          let tdCol = document.createElement("td");
          let evs = personCols[i];
          
          if (evs.length > 0) {
            tdCol.innerHTML = evs.map(e => `<div class="appointment">${e.title}</div>`).join("");
          }

          row.appendChild(tdCol);
        }

        tbody.appendChild(row);
      }
    }

    function changeMonth(direction) {
      currentDate.setMonth(currentDate.getMonth() + direction);
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      renderCalendar();
    }

    function showNextEvents() {
      let next10Days = cachedEvents.filter(e => {
        let d = new Date(e.start);
        let now = new Date();
        let diff = (d - now) / (1000 * 60 * 60 * 24);
        return diff >= 0 && diff <= 10;
      });
      alert("Nächste 10 Tage:\n\n" + (next10Days.length > 0 ? next10Days.map(e => e.title).join("\n") : "Keine Termine in den nächsten 10 Tagen."));
    }

    function showBirthdays() {
      let bdays = cachedEvents.filter(e => e.title.toLowerCase().includes("geburtstag"));
      alert("Geburtstage (nächste Wochen/Monate):\n\n" + (bdays.length > 0 ? bdays.map(e => e.title).join("\n") : "Keine Geburtstage gefunden."));
    }

    fetchEvents();
  </script>

</body>
</html>
