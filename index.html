<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familienplaner - Google Kalender</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --container-bg: #ffffff;
            --grid-line: #cbd5e1;
            --header-dark: #334155; /* Kräftiger & kontrastreicher */
            --accent-color: #0f172a;
            --weekend-bg: #f8fafc;
            --today-bg: #fefce8;

            --color-mama-bg: #f5f7ff; --color-mama-border: #c7d2fe; --color-mama-text: #312e81;
            --color-jonathan-bg: #fdf4ff; --color-jonathan-border: #f5d0fe; --color-jonathan-text: #701a75;
            --color-clara-bg: #fff5f5; --color-clara-border: #fecdd3; --color-clara-text: #881337;
            --color-papa-bg: #f8fafc; --color-papa-border: #cbd5e1; --color-papa-text: #1e293b;
            --color-geburtstag-bg: #fefce8; --color-geburtstag-border: #fde047; --color-geburtstag-text: #713f12;
            --color-all-bg: #fff7ed; --color-all-border: #fed7aa; --color-all-text: #7c2d12;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 4px;
            display: flex;
            justify-content: center;
        }

        .calendar-card {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 1250px;
            border: 1px solid var(--grid-line);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 8px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--grid-line);
            padding-bottom: 8px;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 1.2rem;
            color: var(--header-dark);
            letter-spacing: 0.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            width: 100%;
        }

        .nav-btn {
            background-color: #f8fafc;
            color: var(--header-dark);
            border: 1px solid #94a3b8;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .nav-btn:hover { background-color: #e2e8f0; }

        .action-buttons-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .action-btn-green {
            background-color: var(--header-dark);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .action-btn-green:hover { opacity: 0.9; }

        .today-btn-orange {
            background-color: #d97706;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .today-btn-orange:hover { opacity: 0.9; }

        .month-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--header-dark);
            text-align: center;
            flex-grow: 1;
        }

        .table-container {
            max-height: 75vh;
            overflow-y: auto;
            border: 1px solid var(--grid-line);
            border-radius: 6px;
            background: #fff;
            scroll-behavior: smooth;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background: #fff;
        }

        th, td {
            border: 1px solid var(--grid-line);
            padding: 4px 3px;
            vertical-align: middle;
            font-size: 0.72rem;
            word-break: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            -webkit-hyphens: auto;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--header-dark);
            color: white;
            text-align: center;
            font-size: 0.75rem;
            padding: 7px 1px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .col-tag { width: 40px; cursor: pointer; text-align: center; }         
        .col-mama { width: 18.5%; }         
        .col-jonathan { width: 22%; cursor: pointer; }     
        .col-clara { width: 18.5%; }        
        .col-papa { width: 18.5%; }         
        .col-geburtstag { width: 18.5%; }   

        .day-col {
            text-align: center;
            background-color: #f8fafc;
            font-weight: 600;
            color: #334155;
            position: relative;
        }

        .weekend td {
            background-color: var(--weekend-bg);
        }
        .weekend .day-col {
            background-color: #f1f5f9;
        }

        tr.holiday-row td {
            background-color: #f0fdf4 !important; 
        }
        tr.holiday-row .day-col {
            background-color: #dcfce7 !important;
            color: #065f46;
        }
        .holiday-label {
            font-size: 0.48rem;
            color: #047857;
            margin-top: 1px;
            line-height: 1.1;
            font-weight: 700;
            word-break: break-word;
        }

        tr.today-row td {
            background-color: var(--today-bg) !important;
        }
        tr.today-row .day-col {
            background-color: #fef08a !important;
            color: #713f12;
            border-left: 3px solid #d97706;
        }

        .wooden-peg {
            display: inline-block;
            width: 9px;
            height: 11px;
            vertical-align: middle;
            margin-right: 1px;
        }

        .date-num {
            font-size: 0.8rem;
            display: inline-block;
            vertical-align: middle;
            font-weight: 700;
        }

        .date-day {
            font-size: 0.58rem;
            color: #475569;
            display: block;
            text-transform: uppercase;
        }

        .weather-info {
            font-size: 0.55rem;
            color: var(--header-dark);
            margin-top: 1px;
            line-height: 1;
            font-weight: 700;
            cursor: pointer;
            padding: 1px;
            border-radius: 3px;
            background: rgba(255,255,255,0.9);
            display: inline-block;
        }
        .weather-info:hover {
            background: #e2e8f0;
        }

        .appointment {
            display: block;
            background: var(--color-papa-bg);
            border: 1px solid var(--color-papa-border);
            color: var(--color-papa-text);
            padding: 3px 4px;
            font-size: 0.68rem;
            border-radius: 5px;
            margin-bottom: 2px;
            line-height: 1.2;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.15s;
        }
        .appointment:hover { opacity: 0.85; }

        .appointment.mama { background: var(--color-mama-bg); border-color: var(--color-mama-border); color: var(--color-mama-text); }
        .appointment.jonathan { background: var(--color-jonathan-bg); border-color: var(--color-jonathan-border); color: var(--color-jonathan-text); }
        .appointment.clara { background: var(--color-clara-bg); border-color: var(--color-clara-border); color: var(--color-clara-text); }
        .appointment.papa { background: var(--color-papa-bg); border-color: var(--color-papa-border); color: var(--color-papa-text); }
        .appointment.geburtstag { background: var(--color-geburtstag-bg); border-color: var(--color-geburtstag-border); color: var(--color-geburtstag-text); font-weight: 700; }

        .appointment-all {
            display: block;
            background: var(--color-all-bg);
            border: 1px solid var(--color-all-border);
            color: var(--color-all-text);
            padding: 3px 4px;
            font-size: 0.68rem;
            border-radius: 5px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2px;
            line-height: 1.2;
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .appointment-all:hover { opacity: 0.85; }

        .time-badge {
            font-size: 0.55rem; 
            font-weight: 700; 
            opacity: 0.85; 
            display: block; 
            margin-bottom: 1px;
        }
        
        .shared-row-cell {
            background-color: transparent; 
            border-bottom: none !important;
            padding-bottom: 1px;
        }
        
        .individual-row-cell {
            border-top: none !important;
            padding-top: 1px;
            background-color: transparent; 
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15,23,42,0.6);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            max-width: 350px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 1px solid var(--grid-line);
        }
        .modal-content h3 {
            margin-top: 0;
            color: var(--header-dark);
            font-size: 1.1rem;
        }
        .modal-item {
            font-size: 0.82rem;
            margin: 8px 0;
            color: #1e293b;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 6px;
            line-height: 1.35;
        }
        .close-btn {
            background-color: var(--header-dark);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 14px;
            font-weight: 600;
            font-size: 0.8rem;
            transition: opacity 0.2s;
        }
        .close-btn:hover { opacity: 0.9; }

        @media (max-width: 600px) {
            body { padding: 0; }
            .calendar-card { border: none; border-radius: 0; padding: 4px; box-shadow: none; }
            h1 { font-size: 1.05rem; }
            th, td { font-size: 0.64rem; padding: 2px 1px; }
            thead th { font-size: 0.65rem; padding: 5px 1px; }
            .col-tag { width: 36px; }
        }
    </style>
</head>
<body>

    <div class="calendar-card">
        <header>
            <h1>Familienplaner</h1>
            <div class="nav-bar">
                <button class="nav-btn" onclick="changeMonth(-1)">◀ Zurück</button>
                <div class="month-title" id="monthYearDisplay">Lade Daten...</div>
                <button class="nav-btn" onclick="changeMonth(1)">Vor ▶</button>
            </div>
            <div class="action-buttons-row">
                <button class="action-btn-green" onclick="checkUpcomingEvents()">📅 Nächste Termine</button>
                <button class="today-btn-orange" onclick="goToToday()">📍 Heute</button>
                <button class="action-btn-green" onclick="checkUpcomingBirthdays()">🎂 Geburtstage</button>
            </div>
        </header>

        <div class="table-container" id="tableContainer">
            <table>
                <thead>
                    <tr>
                        <th class="col-tag" onclick="manualRefresh()" title="Kalender aktualisieren">↻</th>
                        <th class="col-mama">Mama</th>
                        <th class="col-jonathan" onclick="openStundenplan()" title="Stundenplan anzeigen">Jonathan</th>
                        <th class="col-clara">Clara</th>
                        <th class="col-papa">Papa</th>
                        <th class="col-geburtstag" style="text-align: center;">
                            <a href="https://calendar.google.com/calendar/render?action=TEMPLATE" target="_blank" title="Neuen Termin erstellen" style="color: white; text-decoration: none; display: block; font-size: 1.1rem; font-weight: bold;">+</a>
                        </th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Wetter-Pop-Up -->
    <div id="weatherModal" class="modal" onclick="closeModal('weatherModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modalDateTitle">Wetter-Vorschau</h3>
            <div id="modalWeatherDetails"></div>
            <button class="close-btn" onclick="closeModal('weatherModal')">Schließen</button>
        </div>
    </div>

    <!-- Geburtstags-Pop-Up -->
    <div id="bdayModal" class="modal" onclick="closeModal('bdayModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>🎂 Geburtstage (nächste 4 Wochen)</h3>
            <div id="bdayList" style="max-height: 250px; overflow-y: auto; margin-top: 10px;"></div>
            <button class="close-btn" onclick="closeModal('bdayModal')">Schließen</button>
        </div>
    </div>

    <!-- Nächste Termine-Pop-Up -->
    <div id="eventsModal" class="modal" onclick="closeModal('eventsModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>📅 Termine nächste 10 Tage</h3>
            <div id="eventsList" style="max-height: 270px; overflow-y: auto; margin-top: 10px;"></div>
            <button class="close-btn" onclick="closeModal('eventsModal')">Schließen</button>
        </div>
    </div>

    <!-- Stundenplan-Pop-Up -->
    <div id="stundenplanModal" class="modal" onclick="closeModal('stundenplanModal')">
        <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 500px;">
            <h3>📚 Stundenplan Jonathan</h3>
            <img src="stundenplan.jpg" alt="Stundenplan" style="width: 100%; border-radius: 6px; margin-top: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
            <button class="close-btn" onclick="closeModal('stundenplanModal')">Schließen</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxts-P_InE6VACAYnm1VF4QhubgGdvnfvgOymMv8Hrhzbne5iQ0hs6iKZ2KySf7ltgjpg/exec";

        const LAT = 48.65;
        const LON = 9.29;

        const monthsNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
        const daysNames = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];

        const todayObj = new Date();
        let currentYear = todayObj.getFullYear();
        let currentMonth = todayObj.getMonth();
        let fetchedEvents = [];
        let weatherData = {};

        window.onload = function() {
            goToToday();
            
            const cachedData = localStorage.getItem("family_calendar_cache");
            if (cachedData) {
                try {
                    fetchedEvents = JSON.parse(cachedData);
                    renderCalendar();
                } catch(e) {}
            }
            
            fetchWeather();
            fetchCalendarEvents();
        };

        function openStundenplan() {
            document.getElementById("stundenplanModal").style.display = "flex";
        }

        function fetchWeather() {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max&timezone=Europe%2FBerlin`;
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data && data.daily) {
                        for (let i = 0; i < data.daily.time.length; i++) {
                            const dateStr = data.daily.time[i];
                            const code = data.daily.weathercode[i];
                            const tMax = Math.round(data.daily.temperature_2m_max[i]);
                            const tMin = Math.round(data.daily.temperature_2m_min[i]);
                            const rainProb = data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[i] : 0;
                            const wind = data.daily.windspeed_10m_max ? Math.round(data.daily.windspeed_10m_max[i]) : 0;

                            weatherData[dateStr] = { 
                                icon: getWeatherIcon(code), 
                                text: getWeatherText(code),
                                tMax: tMax, 
                                tMin: tMin,
                                rainProb: rainProb,
                                wind: wind
                            };
                        }
                        renderCalendar();
                    }
                })
                .catch(err => console.log("Wetter Fehler", err));
        }

        function getWeatherIcon(code) {
            if (code === 0) return "☀️";
            if (code >= 1 && code <= 3) return "⛅";
            if (code >= 45 && code <= 48) return "🌫️";
            if (code >= 51 && code <= 67) return "🌧️";
            if (code >= 71 && code <= 77) return "❄️";
            if (code >= 80 && code <= 82) return "🌦️";
            if (code >= 95) return "🌩️";
            return "🌡️";
        }

        function getWeatherText(code) {
            if (code === 0) return "Sonnig";
            if (code >= 1 && code <= 3) return "Leicht bewölkt";
            if (code >= 45 && code <= 48) return "Nebel";
            if (code >= 51 && code <= 67) return "Regen";
            if (code >= 71 && code <= 77) return "Schnee";
            if (code >= 80 && code <= 82) return "Regenschauer";
            if (code >= 95) return "Gewitter";
            return "Wettervorschau";
        }

        function showWeatherDetails(dateKey, formattedDate) {
            const w = weatherData[dateKey];
            if (!w) return;

            document.getElementById("modalDateTitle").innerText = `Wetter am ${formattedDate}`;
            document.getElementById("modalWeatherDetails").innerHTML = `
                <div style="font-size: 2.2rem; margin: 5px 0;">${w.icon}</div>
                <div style="font-size:0.85rem; margin: 4px 0;"><strong>Zustand:</strong> ${w.text}</div>
                <div style="font-size:0.85rem; margin: 4px 0;"><strong>Höchstwert:</strong> ${w.tMax}°C</div>
                <div style="font-size:0.85rem; margin: 4px 0;"><strong>Tiefstwert:</strong> ${w.tMin}°C</div>
                <div style="font-size:0.85rem; margin: 4px 0;"><strong>Regenrisiko:</strong> ${w.rainProb}%</div>
                <div style="font-size:0.85rem; margin: 4px 0;"><strong>Wind:</strong> bis zu ${w.wind} km/h</div>
            `;
            document.getElementById("weatherModal").style.display = "flex";
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function fetchCalendarEvents() {
            const display = document.getElementById("monthYearDisplay");
            
            if (fetchedEvents.length === 0) {
                display.innerText = "Lade Daten...";
            }
            
            fetch(SCRIPT_URL + "?nocache=" + new Date().getTime())
                .then(response => response.text())
                .then(text => {
                    let cleanText = text.replace(/<[^>]*>?/gm, '');
                    const data = JSON.parse(cleanText);
                    fetchedEvents = data || [];
                    localStorage.setItem("family_calendar_cache", JSON.stringify(fetchedEvents));
                    renderCalendar();
                })
                .catch(error => {
                    console.error("Fehler beim Abrufen:", error);
                    display.innerText = "Ladefehler!";
                    setTimeout(() => renderCalendar(), 2000);
                });
        }

        function manualRefresh() {
            fetchCalendarEvents();
        }

        function getCalendarDayLink(startDate) {
            const evDate = new Date(startDate);
            const yyyy = evDate.getFullYear();
            const mm = String(evDate.getMonth() + 1).padStart(2, '0');
            const dd = String(evDate.getDate()).padStart(2, '0');
            
            return `https://calendar.google.com/calendar/r/day/${yyyy}/${mm}/${dd}`;
        }

        function parseMultiPerson(title) {
            let words = title.split(/\s+/);
            let persons = [];
            let cleanWords = [];
            
            for (let w of words) {
                let cleanW = w.replace(/[\[\]\(\)]/g, '');
                if (/^[mjcp]{2,}$/i.test(cleanW)) {
                    let chars = cleanW.toLowerCase();
                    if (chars.includes('m')) persons.push('Mama');
                    if (chars.includes('j')) persons.push('Jonathan');
                    if (chars.includes('c')) persons.push('Clara');
                    if (chars.includes('p')) persons.push('Papa');
                } else {
                    cleanWords.push(w);
                }
            }
            return {
                cleanTitle: cleanWords.join(' ').trim(),
                persons: [...new Set(persons)]
            };
        }

        function renderCalendar() {
            document.getElementById("monthYearDisplay").innerText = monthsNames[currentMonth] + " " + currentYear;
            const tbody = document.getElementById("calendarBody");
            tbody.innerHTML = "";

            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            const pegSvg = `
                <svg class="wooden-peg" viewBox="0 0 20 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="1" width="5" height="26" rx="1" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
                    <rect x="12" y="1" width="5" height="26" rx="1" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
                    <circle cx="10" cy="12" r="3" fill="#475569"/>
                    <rect x="2" y="11" width="16" height="2" fill="#64748b"/>
                </svg>
            `;

            for (let day = 1; day <= daysInMonth; day++) {
                const dayOfWeek = new Date(currentYear, currentMonth, day).getDay();
                const dayNameStr = daysNames[dayOfWeek];
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

                const isToday = (day === todayObj.getDate() && currentMonth === todayObj.getMonth() && currentYear === todayObj.getFullYear());

                let mamaHtml = "", jonathanHtml = "", claraHtml = "", papaHtml = "", geburtstagHtml = "";
                let allHtml = ""; 
                let dayLabels = ""; 
                let isHoliday = false; 

                const dayStart = new Date(currentYear, currentMonth, day, 0, 0, 0);
                const dayEnd = new Date(currentYear, currentMonth, day, 23, 59, 59);

                const mStr = String(currentMonth + 1).padStart(2, '0');
                const dStr = String(day).padStart(2, '0');
                const isoDateKey = `${currentYear}-${mStr}-${dStr}`;
                const weather = weatherData[isoDateKey];
                
                let weatherHtml = "";
                if (weather) {
                    const formattedDate = `${day}.${currentMonth + 1}.`;
                    weatherHtml = `<div class="weather-info" onclick="showWeatherDetails('${isoDateKey}', '${formattedDate}')">${weather.icon}${weather.tMax}°</div>`;
                }

                fetchedEvents.forEach(event => {
                    const evStart = new Date(event.start);
                    const evEnd = new Date(event.end);

                    if (evStart <= dayEnd && evEnd > dayStart) {
                        const titleText = event.title || "Termin";
                        const titleLower = titleText.toLowerCase();
                        const colorId = event.color;

                        const isPersonalAppointment = (colorId === "1" || colorId === "#7986cb" || colorId === "#a4bdfc" ||
                                                       colorId === "3" || colorId === "#8e24aa" || colorId === "#dbadff" ||
                                                       colorId === "4" || colorId === "#e67c73" || colorId === "#ff887c" ||
                                                       colorId === "8" || colorId === "#616161" || colorId === "#e1e1e1" ||
                                                       colorId === "5" || colorId === "#f6bf26" || colorId === "#fbd75b");

                        const isSystemHoliday = !isPersonalAppointment && (
                            event.type === "holiday" || event.type === "ferien" || 
                            titleLower.includes("feiertag") || 
                            titleLower.includes("schulferien") ||
                            titleLower.includes("osterferien") || 
                            titleLower.includes("sommerferien") || 
                            titleLower.includes("pfingstferien") || 
                            titleLower.includes("herbstferien") || 
                            titleLower.includes("weihnachtsferien") || 
                            titleLower.includes("faschingsferien") ||
                            titleLower.includes("neujahr") ||
                            titleLower.includes("heilige drei könige") ||
                            titleLower.includes("karfreitag") ||
                            titleLower.includes("ostermontag") ||
                            titleLower.includes("tag der arbeit") ||
                            titleLower.includes("christi himmelfahrt") ||
                            titleLower.includes("pfingstmontag") ||
                            titleLower.includes("fronleichnam") ||
                            titleLower.includes("tag der deutschen einheit") ||
                            titleLower.includes("reformationstag") ||
                            titleLower.includes("allerheiligen") ||
                            titleLower.includes("weihnachtstag")
                        );

                        if (isSystemHoliday) {
                            isHoliday = true;
                            let cleanTitle = titleText
                                .replace(/Baden-Württemberg/gi, '')
                                .replace(/[-–]\s*BW\b/gi, '')
                                .replace(/\(regionaler Feiertag\)/gi, '')
                                .trim();
                            dayLabels += `<div class="holiday-label">${cleanTitle}</div>`;
                        } 
                        else {
                            let timeHtml = "";
                            if (!event.allDay) {
                                const hours = String(evStart.getHours()).padStart(2, '0');
                                const minutes = String(evStart.getMinutes()).padStart(2, '0');
                                timeHtml = `<span class="time-badge">🕒 ${hours}:${minutes}</span>`;
                            }

                            const dayLink = getCalendarDayLink(event.start);
                            const parsed = parseMultiPerson(titleText);
                            const finalTitleContent = timeHtml + (parsed.cleanTitle || titleText);

                            if (colorId === "5" || colorId === "#f6bf26" || colorId === "#fbd75b") { 
                                let rawBday = parsed.cleanTitle || titleText;
                                let cleanBday = rawBday.replace(/geburtstag/gi, '').trim();
                                let finalBdayText = cleanBday !== '' ? cleanBday : rawBday;
                                geburtstagHtml += `<a href="${dayLink}" target="_blank" class="appointment geburtstag" title="Im Google Kalender öffnen">🎂 ${timeHtml + finalBdayText}</a>`; 
                            }
                            else if (parsed.persons.length > 0) {
                                const multiHtml = `<a href="${dayLink}" target="_blank" class="appointment-all" title="Im Google Kalender öffnen">${finalTitleContent}</a>`;
                                if (parsed.persons.includes('Mama')) mamaHtml += multiHtml;
                                if (parsed.persons.includes('Jonathan')) jonathanHtml += multiHtml;
                                if (parsed.persons.includes('Clara')) claraHtml += multiHtml;
                                if (parsed.persons.includes('Papa')) papaHtml += multiHtml;
                            }
                            else if (colorId === "1" || colorId === "#7986cb" || colorId === "#a4bdfc") { 
                                mamaHtml += `<a href="${dayLink}" target="_blank" class="appointment mama" title="Im Google Kalender öffnen">${finalTitleContent}</a>`; 
                            } 
                            else if (colorId === "3" || colorId === "#8e24aa" || colorId === "#dbadff") { 
                                jonathanHtml += `<a href="${dayLink}" target="_blank" class="appointment jonathan" title="Im Google Kalender öffnen">${finalTitleContent}</a>`; 
                            } 
                            else if (colorId === "4" || colorId === "#e67c73" || colorId === "#ff887c") { 
                                claraHtml += `<a href="${dayLink}" target="_blank" class="appointment clara" title="Im Google Kalender öffnen">${finalTitleContent}</a>`; 
                            } 
                            else if (colorId === "8" || colorId === "#616161" || colorId === "#e1e1e1") { 
                                papaHtml += `<a href="${dayLink}" target="_blank" class="appointment papa" title="Im Google Kalender öffnen">${finalTitleContent}</a>`; 
                            } 
                            else {
                                allHtml += `<a href="${dayLink}" target="_blank" class="appointment-all" title="Im Google Kalender öffnen">${finalTitleContent}</a>`; 
                            }
                        }
                    }
                });

                const pegHtml = isToday ? pegSvg : ``;

                const firstColHtml = `
                    ${pegHtml}<span class="date-num">${day}</span> 
                    <span class="date-day">${dayNameStr.substring(0, 2)}</span>
                    ${weatherHtml}
                    ${dayLabels}
                `;

                if (allHtml !== "") {
                    const row1 = document.createElement("tr");
                    const row2 = document.createElement("tr");
                    if (isWeekend) { row1.classList.add("weekend"); row2.classList.add("weekend"); }
                    if (isHoliday) { row1.classList.add("holiday-row"); row2.classList.add("holiday-row"); }
                    if (isToday) { row1.classList.add("today-row"); row2.classList.add("today-row"); row1.id = "todayElement"; }

                    row1.innerHTML = `
                        <td class="day-col col-tag" rowspan="2">${firstColHtml}</td>
                        <td colspan="4" class="shared-row-cell">${allHtml}</td>
                        <td class="col-geburtstag" rowspan="2">${geburtstagHtml}</td>
                    `;

                    row2.innerHTML = `
                        <td class="col-mama individual-row-cell">${mamaHtml}</td>
                        <td class="col-jonathan individual-row-cell">${jonathanHtml}</td>
                        <td class="col-clara individual-row-cell">${claraHtml}</td>
                        <td class="col-papa individual-row-cell">${papaHtml}</td>
                    `;

                    tbody.appendChild(row1);
                    tbody.appendChild(row2);
                } 
                else {
                    const row = document.createElement("tr");
                    if (isWeekend) row.classList.add("weekend");
                    if (isHoliday) row.classList.add("holiday-row");
                    if (isToday) { row.classList.add("today-row"); row.id = "todayElement"; }
                    
                    row.innerHTML = `
                        <td class="col-tag day-col">${firstColHtml}</td>
                        <td class="col-mama">${mamaHtml}</td>
                        <td class="col-jonathan">${jonathanHtml}</td>
                        <td class="col-clara">${claraHtml}</td>
                        <td class="col-papa">${papaHtml}</td>
                        <td class="col-geburtstag">${geburtstagHtml}</td>
                    `;
                    tbody.appendChild(row);
                }
            }

            setTimeout(() => {
                const container = document.getElementById("tableContainer");
                const isThisMonth = (currentMonth === todayObj.getMonth() && currentYear === todayObj.getFullYear());
                const todayElem = document.getElementById("todayElement");

                if (isThisMonth && todayElem) {
                    todayElem.scrollIntoView({ behavior: "smooth", block: "center" });
                } else if (container) {
                    container.scrollTop = 0;
                }
            }, 300);
        }

        function goToToday() {
            currentYear = todayObj.getFullYear();
            currentMonth = todayObj.getMonth();
            renderCalendar();
        }

        function checkUpcomingBirthdays() {
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            
            const in28Days = new Date(now);
            in28Days.setDate(now.getDate() + 28);

            let upcoming = [];

            fetchedEvents.forEach(e => {
                if (e.color === "5" || e.color === "#f6bf26" || e.color === "#fbd75b") {
                    const evDate = new Date(e.start);
                    evDate.setHours(0, 0, 0, 0);

                    if (evDate >= now && evDate <= in28Days) {
                        const dayStr = String(evDate.getDate()).padStart(2, '0');
                        const monthStr = String(evDate.getMonth() + 1).padStart(2, '0');
                        
                        let rawName = e.title || "Geburtstag";
                        let cleanName = rawName.replace(/geburtstag/gi, '').trim();
                        let finalName = cleanName !== '' ? cleanName : rawName;

                        upcoming.push({ name: finalName, date: `${dayStr}.${monthStr}.`, fullDate: evDate });
                    }
                }
            });

            upcoming.sort((a, b) => a.fullDate - b.fullDate);

            const listContainer = document.getElementById("bdayList");
            if (upcoming.length === 0) {
                listContainer.innerHTML = `<div style="font-size:0.85rem; color:#666; padding:10px;">In den nächsten 4 Wochen stehen keine Geburtstage an.</div>`;
            } else {
                let html = "";
                upcoming.forEach(item => {
                    html += `<div class="modal-item">🎂 <strong>${item.date}</strong> - ${item.name}</div>`;
                });
                listContainer.innerHTML = html;
            }
            document.getElementById("bdayModal").style.display = "flex";
        }

        function checkUpcomingEvents() {
            const now = new Date();
            now.setHours(0, 0, 0, 0);

            let groupedList = [];

            for (let i = 0; i < 10; i++) {
                const checkDate = new Date(now);
                checkDate.setDate(now.getDate() + i);

                const dayStart = new Date(checkDate.getFullYear(), checkDate.getMonth(), checkDate.getDate(), 0, 0, 0);
                const dayEnd = new Date(checkDate.getFullYear(), checkDate.getMonth(), checkDate.getDate(), 23, 59, 59);

                const dayOfWeek = daysNames[checkDate.getDay()].substring(0, 2);
                const dayStr = String(checkDate.getDate()).padStart(2, '0');
                const monthStr = String(checkDate.getMonth() + 1).padStart(2, '0');
                const dateHeader = `${dayOfWeek} ${dayStr}.${monthStr}.`;

                let dayItems = [];

                fetchedEvents.forEach(e => {
                    const titleLower = (e.title || "").toLowerCase();
                    const isPersonal = (e.color === "1" || e.color === "#7986cb" || e.color === "#a4bdfc" ||
                                        e.color === "3" || e.color === "#8e24aa" || e.color === "#dbadff" ||
                                        e.color === "4" || e.color === "#e67c73" || e.color === "#ff887c" ||
                                        e.color === "8" || e.color === "#616161" || e.color === "#e1e1e1");
                    const isHolidayOrFerien = !isPersonal && (e.type === "holiday" || e.type === "ferien" || titleLower.includes("ferien") || titleLower.includes("feiertag"));
                    const isBday = e.color === "5" || e.color === "#f6bf26" || e.color === "#fbd75b";

                    if (!isHolidayOrFerien && !isBday) {
                        const evStart = new Date(e.start);
                        const evEnd = new Date(e.end);

                        if (evStart <= dayEnd && evEnd > dayStart) {
                            const parsed = parseMultiPerson(e.title || "Termin");
                            let personStr = "Alle";

                            if (parsed.persons.length > 0) {
                                personStr = parsed.persons.join(" & ");
                            } else {
                                const c = e.color;
                                if (c === "1" || c === "#7986cb" || c === "#a4bdfc") personStr = "Mama";
                                else if (c === "3" || c === "#8e24aa" || c === "#dbadff") personStr = "Jonathan";
                                else if (c === "4" || c === "#e67c73" || c === "#ff887c") personStr = "Clara";
                                else if (c === "8" || c === "#616161" || c === "#e1e1e1") personStr = "Papa";
                            }

                            let timeStr = "";
                            if (!e.allDay) {
                                const hh = String(evStart.getHours()).padStart(2, '0');
                                const mm = String(evStart.getMinutes()).padStart(2, '0');
                                timeStr = ` (🕒 ${hh}:${mm})`;
                            }

                            dayItems.push(`${parsed.cleanTitle} (${personStr})${timeStr}`);
                        }
                    }
                });

                if (dayItems.length > 0) {
                    groupedList.push({
                        header: dateHeader,
                        items: dayItems
                    });
                }
            }

            const listContainer = document.getElementById("eventsList");
            if (groupedList.length === 0) {
                listContainer.innerHTML = `<div style="font-size:0.85rem; color:#666; padding:10px;">In den nächsten 10 Tagen stehen keine Anlässe an.</div>`;
            } else {
                let html = "";
                groupedList.forEach(group => {
                    const eventLines = group.items.join("<br>• ");
                    html += `<div class="modal-item">📌 <strong>${group.header}</strong><br>• ${eventLines}</div>`;
                });
                listContainer.innerHTML = html;
            }
            document.getElementById("eventsModal").style.display = "flex";
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(); 
        }

        window.addEventListener('pageshow', function(event) {
            fetchCalendarEvents();
        });
    </script>
