<script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxts-P_InE6VACAYnm1VF4QhubgGdvnfvgOymMv8Hrhzbne5iQ0hs6iKZ2KySf7ltgjpg/exec";

        const LAT = 48.65;
        const LON = 9.29;

        const monthsNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
        const daysNames = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];

        const todayObj = new Date();
        let currentYear = todayObj.getFullYear();
        let currentMonth = todayObj.getMonth();
        let fetchedEvents = [];
        let weatherData = {};

        window.onload = function() {
            const cachedData = localStorage.getItem("family_calendar_cache");
            if (cachedData) {
                try {
                    fetchedEvents = JSON.parse(cachedData);
                    renderCalendar();
                } catch(e) {}
            }
            
            fetchWeather();
            fetchCalendarEvents();
        };

        // Automatisches Aktualisieren beim Zurückkehren aus der Kalender-App
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === "visible") {
                fetchCalendarEvents(true); // Erzwingt frischen Abruf
            }
        });

        window.addEventListener("pageshow", function(event) {
            if (event.persisted) {
                fetchCalendarEvents(true);
            }
        });

        function fetchWeather() {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max&timezone=Europe%2FBerlin`;
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data && data.daily) {
                        for (let i = 0; i < data.daily.time.length; i++) {
                            const dateStr = data.daily.time[i];
                            const code = data.daily.weathercode[i];
                            const tMax = Math.round(data.daily.temperature_2m_max[i]);
                            const tMin = Math.round(data.daily.temperature_2m_min[i]);
                            const rainProb = data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[i] : 0;
                            const wind = data.daily.windspeed_10m_max ? Math.round(data.daily.windspeed_10m_max[i]) : 0;

                            weatherData[dateStr] = { 
                                icon: getWeatherIcon(code), 
                                text: getWeatherText(code),
                                tMax: tMax, 
                                tMin: tMin,
                                rainProb: rainProb,
                                wind: wind
                            };
                        }
                        renderCalendar();
                    }
                })
                .catch(err => console.log("Wetter Fehler", err));
        }

        function getWeatherIcon(code) {
            if (code === 0) return "☀️";
            if (code >= 1 && code <= 3) return "⛅";
            if (code >= 45 && code <= 48) return "🌫️";
            if (code >= 51 && code <= 67) return "🌧️";
            if (code >= 71 && code <= 77) return "❄️";
            if (code >= 80 && code <= 82) return "🌦️";
            if (code >= 95) return "🌩️";
            return "🌡️";
        }

        function getWeatherText(code) {
            if (code === 0) return "Sonnig";
            if (code >= 1 && code <= 3) return "Leicht bewölkt";
            if (code >= 45 && code <= 48) return "Nebel";
            if (code >= 51 && code <= 67) return "Regen";
            if (code >= 71 && code <= 77) return "Schnee";
            if (code >= 80 && code <= 82) return "Regenschauer";
            if (code >= 95) return "Gewitter";
            return "Wettervorschau";
        }

        function showWeatherDetails(dateKey, formattedDate) {
            const w = weatherData[dateKey];
            if (!w) return;

            document.getElementById("modalDateTitle").innerText = `Wetter am ${formattedDate}`;
            document.getElementById("modalWeatherDetails").innerHTML = `
                <div style="font-size: 2.2rem; margin: 5px 0;">${w.icon}</div>
                <div style="font-size:0.85rem; margin: 4px 0;"><strong>Zustand:</strong> ${w.text}</div>
                <div style="font-size:0.85rem; margin: 4px 0;"><strong>Höchstwert:</strong> ${w.tMax}°C</div>
                <div style="font-size:0.85rem; margin: 4px 0;"><strong>Tiefstwert:</strong> ${w.tMin}°C</div>
                <div style="font-size:0.85rem; margin: 4px 0;"><strong>Regenrisiko:</strong> ${w.rainProb}%</div>
                <div style="font-size:0.85rem; margin: 4px 0;"><strong>Wind:</strong> bis zu ${w.wind} km/h</div>
            `;
            document.getElementById("weatherModal").style.display = "flex";
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function fetchCalendarEvents(forceRefresh = false) {
            if (fetchedEvents.length === 0 || forceRefresh) {
                document.getElementById("monthYearDisplay").innerText = "Lade Daten...";
            }
            
            // Verhindert Cache-Probleme beim Neuladen
            const urlWithCacheBuster = SCRIPT_URL + (forceRefresh ? "?nocache=" + new Date().getTime() : "");

            fetch(urlWithCacheBuster)
                .then(response => response.json())
                .then(data => {
                    fetchedEvents = data || [];
                    localStorage.setItem("family_calendar_cache", JSON.stringify(fetchedEvents));
                    renderCalendar();
                })
                .catch(error => {
                    console.error("Fehler beim Abrufen:", error);
                    if (fetchedEvents.length === 0) {
                        document.getElementById("monthYearDisplay").innerText = "Ladefehler!";
                    }
                });
        }

        function getCalendarDayLink(startDate) {
            const evDate = new Date(startDate);
            const yyyy = evDate.getFullYear();
            const mm = String(evDate.getMonth() + 1).padStart(2, '0');
            const dd = String(evDate.getDate()).padStart(2, '0');
            
            return `https://calendar.google.com/calendar/r/day/${yyyy}/${mm}/${dd}`;
        }

        function renderCalendar() {
            document.getElementById("monthYearDisplay").innerText = monthsNames[currentMonth] + " " + currentYear;
            const tbody = document.getElementById("calendarBody");
            tbody.innerHTML = "";

            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            const pegSvg = `
                <svg class="wooden-peg" viewBox="0 0 20 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="1" width="5" height="26" rx="1" fill="#c29b62" stroke="#8a6838" stroke-width="1"/>
                    <rect x="12" y="1" width="5" height="26" rx="1" fill="#c29b62" stroke="#8a6838" stroke-width="1"/>
                    <circle cx="10" cy="12" r="3" fill="#717a8a"/>
                    <rect x="2" y="11" width="16" height="2" fill="#9da3af"/>
                </svg>
            `;

            for (let day = 1; day <= daysInMonth; day++) {
                const dayOfWeek = new Date(currentYear, currentMonth, day).getDay();
                const dayNameStr = daysNames[dayOfWeek];
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

                const isToday = (day === todayObj.getDate() && currentMonth === todayObj.getMonth() && currentYear === todayObj.getFullYear());

                let mamaHtml = "", jonathanHtml = "", claraHtml = "", papaHtml = "", geburtstagHtml = "";
                let allHtml = ""; 
                let dayLabels = ""; 
                let isHoliday = false; 

                const dayStart = new Date(currentYear, currentMonth, day, 0, 0, 0);
                const dayEnd = new Date(currentYear, currentMonth, day, 23, 59, 59);

                const mStr = String(currentMonth + 1).padStart(2, '0');
                const dStr = String(day).padStart(2, '0');
                const isoDateKey = `${currentYear}-${mStr}-${dStr}`;
                const weather = weatherData[isoDateKey];
                
                let weatherHtml = "";
                if (weather) {
                    const formattedDate = `${day}.${currentMonth + 1}.`;
                    weatherHtml = `<div class="weather-info" onclick="showWeatherDetails('${isoDateKey}', '${formattedDate}')">${weather.icon}${weather.tMax}°</div>`;
                }

                fetchedEvents.forEach(event => {
                    const evStart = new Date(event.start);
                    const evEnd = new Date(event.end);

                    if (evStart <= dayEnd && evEnd > dayStart) {
                        const titleText = event.title || "Termin";
                        
                        if (event.type === "holiday" || event.type === "ferien") {
                            isHoliday = true;
                            dayLabels += `<div class="holiday-label">🏖️ ${titleText}</div>`;
                        } 
                        else {
                            let timeHtml = "";
                            if (!event.allDay) {
                                const hours = evStart.getHours().toString().padStart(2, '0');
                                const minutes = evStart.getMinutes().toString().padStart(2, '0');
                                timeHtml = `<span class="time-badge">🕒 ${hours}:${minutes}</span>`;
                            }

                            const bellUrl = getCalendarDayLink(event.start);
                            const bellBtn = `<a href="${bellUrl}" target="_blank" class="reminder-bell" title="Kalendertag öffnen">🔔</a>`;

                            const title = timeHtml + titleText + bellBtn;
                            const colorId = event.color; 
                            
                            if (colorId === "1" || colorId === "#7986cb" || colorId === "#a4bdfc") { 
                                mamaHtml += `<div class="appointment mama">${title}</div>`; 
                            } 
                            else if (colorId === "3" || colorId === "#8e24aa" || colorId === "#dbadff") { 
                                jonathanHtml += `<div class="appointment jonathan">${title}</div>`; 
                            } 
                            else if (colorId === "4" || colorId === "#e67c73" || colorId === "#ff887c") { 
                                claraHtml += `<div class="appointment clara">${title}</div>`; 
                            } 
                            else if (colorId === "5" || colorId === "#f6bf26" || colorId === "#fbd75b") { 
                                geburtstagHtml += `<div class="appointment geburtstag">🎂 ${title}</div>`; 
                            } 
                            else if (colorId === "8" || colorId === "#616161" || colorId === "#e1e1e1") { 
                                papaHtml += `<div class="appointment papa">${title}</div>`; 
                            } 
                            else {
                                allHtml += `<div class="appointment-all">🌟 ${title}</div>`; 
                            }
                        }
                    }
                });

                const pegHtml = isToday ? pegSvg : ``;

                const firstColHtml = `
                    ${pegHtml}<span class="date-num">${day}</span> 
                    <span class="date-day">${dayNameStr.substring(0, 2)}</span>
                    ${weatherHtml}
                    ${dayLabels}
                `;

                if (allHtml !== "") {
                    const row1 = document.createElement("tr");
                    const row2 = document.createElement("tr");
                    if (isWeekend) { row1.classList.add("weekend"); row2.classList.add("weekend"); }
                    if (isHoliday) { row1.classList.add("holiday-row"); row2.classList.add("holiday-row"); }
                    if (isToday) { row1.classList.add("today-row"); row2.classList.add("today-row"); row1.id = "todayElement"; }

                    row1.innerHTML = `
                        <td class="day-col col-tag" rowspan="2">${firstColHtml}</td>
                        <td colspan="4" class="shared-row-cell">${allHtml}</td>
                        <td class="col-geburtstag" rowspan="2">${geburtstagHtml}</td>
                    `;

                    row2.innerHTML = `
                        <td class="col-mama individual-row-cell">${mamaHtml}</td>
                        <td class="col-jonathan individual-row-cell">${jonathanHtml}</td>
                        <td class="col-clara individual-row-cell">${claraHtml}</td>
                        <td class="col-papa individual-row-cell">${papaHtml}</td>
                    `;

                    tbody.appendChild(row1);
                    tbody.appendChild(row2);
                } 
                else {
                    const row = document.createElement("tr");
                    if (isWeekend) row.classList.add("weekend");
                    if (isHoliday) row.classList.add("holiday-row");
                    if (isToday) { row.classList.add("today-row"); row.id = "todayElement"; }
                    
                    row.innerHTML = `
                        <td class="day-col col-tag">${firstColHtml}</td>
                        <td class="col-mama">${mamaHtml}</td>
                        <td class="col-jonathan">${jonathanHtml}</td>
                        <td class="col-clara">${claraHtml}</td>
                        <td class="col-papa">${papaHtml}</td>
                        <td class="col-geburtstag">${geburtstagHtml}</td>
                    `;
                    tbody.appendChild(row);
                }
            }

            setTimeout(() => {
                const container = document.getElementById("tableContainer");
                const isThisMonth = (currentMonth === todayObj.getMonth() && currentYear === todayObj.getFullYear());
                const todayElem = document.getElementById("todayElement");

                if (isThisMonth && todayElem) {
                    todayElem.scrollIntoView({ behavior: "smooth", block: "center" });
                } else if (container) {
                    container.scrollTop = 0;
                }
            }, 300);
        }

        function goToToday() {
            currentYear = todayObj.getFullYear();
            currentMonth = todayObj.getMonth();
            renderCalendar();
        }

        function checkUpcomingBirthdays() {
            const now = new Date();
            const in28Days = new Date();
            in28Days.setDate(now.getDate() + 28);

            let upcoming = [];

            fetchedEvents.forEach(e => {
                if (e.color === "5" || e.color === "#f6bf26" || e.color === "#fbd75b") {
                    const evDate = new Date(e.start);
                    if (evDate >= now && evDate <= in28Days) {
                        const dayStr = evDate.getDate().toString().padStart(2, '0');
                        const monthStr = (evDate.getMonth() + 1).toString().padStart(2, '0');
                        upcoming.push({ name: e.title, date: `${dayStr}.${monthStr}.`, fullDate: evDate });
                    }
                }
            });

            upcoming.sort((a, b) => a.fullDate - b.fullDate);

            const listContainer = document.getElementById("bdayList");
            if (upcoming.length === 0) {
                listContainer.innerHTML = `<div style="font-size:0.85rem; color:#666; padding:10px;">In den nächsten 4 Wochen stehen keine Geburtstage an.</div>`;
            } else {
                let html = "";
                upcoming.forEach(item => {
                    html += `<div class="modal-item">🎂 <strong>${item.date}</strong> - ${item.name}</div>`;
                });
                listContainer.innerHTML = html;
            }
            document.getElementById("bdayModal").style.display = "flex";
        }

        function checkUpcomingEvents() {
            const now = new Date();
            now.setHours(0, 0, 0, 0);

            let groupedList = [];

            for (let i = 0; i < 10; i++) {
                const checkDate = new Date(now);
                checkDate.setDate(now.getDate() + i);

                const dayStart = new Date(checkDate.getFullYear(), checkDate.getMonth(), checkDate.getDate(), 0, 0, 0);
                const dayEnd = new Date(checkDate.getFullYear(), checkDate.getMonth(), checkDate.getDate(), 23, 59, 59);

                const dayOfWeek = daysNames[checkDate.getDay()].substring(0, 2);
                const dayStr = checkDate.getDate().toString().padStart(2, '0');
                const monthStr = (checkDate.getMonth() + 1).toString().padStart(2, '0');
                const dateHeader = `${dayOfWeek} ${dayStr}.${monthStr}.`;

                let dayItems = [];

                fetchedEvents.forEach(e => {
                    if (e.type !== "holiday" && e.type !== "ferien" && e.color !== "5" && e.color !== "#f6bf26" && e.color !== "#fbd75b") {
                        const evStart = new Date(e.start);
                        const evEnd = new Date(e.end);

                        if (evStart <= dayEnd && evEnd > dayStart) {
                            let person = "Alle";
                            const c = e.color;
                            if (c === "1" || c === "#7986cb" || c === "#a4bdfc") person = "Mama";
                            else if (c === "3" || c === "#8e24aa" || c === "#dbadff") person = "Jonathan";
                            else if (c === "4" || c === "#e67c73" || c === "#ff887c") person = "Clara";
                            else if (c === "8" || c === "#616161" || c === "#e1e1e1") person = "Papa";

                            let timeStr = "";
                            if (!e.allDay) {
                                const hh = evStart.getHours().toString().padStart(2, '0');
                                const mm = evStart.getMinutes().toString().padStart(2, '0');
                                timeStr = ` (🕒 ${hh}:${mm})`;
                            }

                            dayItems.push(`${e.title} (${person})${timeStr}`);
                        }
                    }
                });

                if (dayItems.length > 0) {
                    groupedList.push({
                        header: dateHeader,
                        items: dayItems
                    });
                }
            }

            const listContainer = document.getElementById("eventsList");
            if (groupedList.length === 0) {
                listContainer.innerHTML = `<div style="font-size:0.85rem; color:#666; padding:10px;">In den nächsten 10 Tagen stehen keine Anlässe an.</div>`;
            } else {
                let html = "";
                groupedList.forEach(group => {
                    const eventLines = group.items.join("<br>• ");
                    html += `<div class="modal-item">📌 <strong>${group.header}</strong><br>• ${eventLines}</div>`;
                });
                listContainer.innerHTML = html;
            }
            document.getElementById("eventsModal").style.display = "flex";
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(); 
        }
    </script>
