<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Familien-Küchenkalender Familie Zemmel</title>
  <style>
    :root {
      --primary-color: #2e5a36;
      --bg-color: #f4f6f4;
      --text-color: #333;
      --border-color: #d1d8d1;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }
    header {
      background-color: var(--primary-color);
      color: white;
      padding: 10px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .nav-bar button, .nav-bar a {
      background-color: white;
      color: var(--primary-color);
      border: none;
      padding: 8px 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }
    .actions-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 5px;
    }
    .actions-bar a, .actions-bar button {
      background-color: white;
      color: var(--primary-color);
      border: none;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 5px;
    }
    th, td {
      border: 1px solid var(--border-color);
      padding: 6px 4px;
      text-align: center;
      font-size: 13px;
    }
    th {
      background-color: var(--primary-color);
      color: white;
    }
    .day-cell {
      font-weight: bold;
      width: 15%;
      background-color: #fafafa;
    }
    /* Floating Action Button für neue Termine */
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--primary-color);
      color: white;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      text-decoration: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-bar">
      <button onclick="changeMonth(-1)">&lt; Zurück</button>
      <h2 id="month-year-title" style="margin: 0; font-size: 18px;">Lade...</h2>
      <button onclick="changeMonth(1)">Vor &gt;</button>
    </div>
    <div class="actions-bar">
      <a href="https://calendar.google.com/calendar/u/0/r/day" target="_blank">🔔 Tagesansicht</a>
      <button onclick="goToToday()">📍 Heute</button>
      <button onclick="openBirthdays()">🎂 Geburtstage</button>
    </div>
  </header>

  <div id="calendar-container">
    <table id="calendar-table">
      <thead>
        <tr>
          <th>Tag</th>
          <th>Mama</th>
          <th>Jonathan</th>
          <th>Clara</th>
          <th>Papa</th>
        </tr>
      </thead>
      <tbody id="calendar-body">
        <!-- Wird dynamisch gefüllt -->
      </tbody>
    </table>
  </div>

  <!-- Schwebender + Button verlinkt direkt auf die Google Kalender App Erstellen-Ansicht -->
  <a href="https://calendar.google.com/calendar/u/0/r/eventedit" target="_blank" class="fab">+</a>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxts-P_InE6VACAYnm1VF4QhubgGdvnfvgOymMv8Hrhzbne5iQ0hs6iKZ2KySf7ltgjpg/exec";
    
    let currentDate = new Date();
    let cachedEvents = [];

    async function fetchEvents() {
      try {
        // Cache mit einem Zeitstempel umgehen, damit Google immer die frischen Daten liefert
        let response = await fetch(SCRIPT_URL + "?nocache=" + new Date().getTime());
        cachedEvents = await response.json();
        renderCalendar();
      } catch (error) {
        document.getElementById("month-year-title").innerText = "Ladefehler!";
      }
    }

    function renderCalendar() {
      let year = currentDate.getFullYear();
      let month = currentDate.getMonth();

      const months = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
      document.getElementById("month-year-title").innerText = months[month] + " " + year;

      let tbody = document.getElementById("calendar-body");
      tbody.innerHTML = "";

      let daysInMonth = new Date(year, month + 1, 0).getDate();
      let weekdays = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

      for (let day = 1; day <= daysInMonth; day++) {
        let dateObj = new Date(year, month, day);
        let dayOfWeek = weekdays[dateObj.getDay()];

        let row = document.createElement("tr");

        let tdDay = document.createElement("td");
        tdDay.className = "day-cell";
        tdDay.innerHTML = `${dayOfWeek}<br><strong>${day}</strong>`;
        
        // Aktuellen Tag hervorheben
        let today = new Date();
        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          tdDay.style.backgroundColor = "#ffeeba";
        }
        row.appendChild(tdDay);

        // 4 Spalten für: Mama, Jonathan, Clara, Papa
        for (let i = 0; i < 4; i++) {
          let tdCol = document.createElement("td");
          
          // Passende Termine für diesen Tag filtern
          let dayEvents = cachedEvents.filter(ev => {
            let evDate = new Date(ev.start);
            return evDate.getDate() === day && evDate.getMonth() === month && evDate.getFullYear() === year;
          });

          // Hier greift nun unser sicherer Fallback: 
          // Jedes Event landet zuverlässig im Planer, ohne dass farblose Standard-Termine verschluckt werden.
          if (dayEvents.length > 0) {
            tdCol.innerHTML = dayEvents.map(e => `<div style="font-size:11px; margin-bottom:2px; padding:2px; background:#e2f0d9; border-radius:3px;">${e.title}</div>`).join("");
          }

          row.appendChild(tdCol);
        }

        tbody.appendChild(row);
      }
    }

    function changeMonth(direction) {
      currentDate.setMonth(currentDate.getMonth() + direction);
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      renderCalendar();
    }

    function openBirthdays() {
      alert("Geburtstags-Ansicht folgt.");
    }

    // Automatischer Frische-Abruf, wenn man per Zurück-Taste aus der Google Kalender App zurückkehrt
    window.addEventListener('pageshow', function(event) {
      fetchEvents();
    });

    // Erster Start beim Laden der Seite
    fetchEvents();
  </script>

</body>
</html>
